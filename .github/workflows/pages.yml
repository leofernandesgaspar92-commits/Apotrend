# Veröffentlicht auf GitHub Pages NUR NOCH eine Weiterleitung zur Live-App.
#
# Vorher lag hier die ALTE App (frontend/) mit fest eingebauten Beispieldaten —
# darunter ein österreichischer Großhändler samt erfundener Ansprechperson, der
# in JEDEM Land erschien, auch nach dem Wechsel auf Portugal. Wer die
# Pages-Adresse als Lesezeichen hatte, hielt das für die App. pages/ enthält
# nur index.html und 404.html (fängt alte Unterpfade wie /frontend/ ab).
#
# Einmalig nötig: Repo → Settings → Pages → Source: "GitHub Actions"
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/
      - id: deployment
        uses: actions/deploy-pages@v4
