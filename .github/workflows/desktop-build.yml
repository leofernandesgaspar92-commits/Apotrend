# Baut die ApoTrend-Desktop-Installer (Windows/macOS/Linux) auf echten Runnern.
# Loest das lokale 403-Problem (Electron-Binary-Download) und liefert die
# fertigen Installer als Artefakte — ohne die Mobile-/PWA-Version zu beruehren.
name: Desktop Build

on:
  push:
    branches: [desktop-build]
    paths:
      - 'desktop/**'
      - 'frontend/index.html'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build installer (unsigniert)
        working-directory: desktop
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: apotrend-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
