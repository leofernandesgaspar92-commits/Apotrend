# Baut die ApoTrend-Desktop-Installer (Windows/macOS/Linux) auf echten Runnern.
# - Bei Push auf desktop-build: nur bauen + als Artefakte hochladen (Verifikation).
# - Manuell (workflow_dispatch, release=true): zusaetzlich ein DRAFT-Release mit
#   allen Installern erstellen (finales "Publish" macht der Owner).
# Beruehrt die Mobile-/PWA-Version nicht (frontend/index.html bleibt unveraendert).
name: Desktop Build

on:
  push:
    branches: [desktop-build]
    paths:
      - 'desktop/**'
      - 'frontend/index.html'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Draft-Release v1.0.0 mit Installern erstellen'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Signatur nur vorbereiten, wenn ein Zertifikat-Secret gesetzt ist: dann
      # CSC_LINK/CSC_KEY_PASSWORD via $GITHUB_ENV setzen. Ohne Secret passiert
      # nichts -> der Build-Step laeuft exakt wie im bekannten gruenen Zustand
      # (Standard-Shell, keine Env-Manipulation). Details: desktop/SIGNING.md
      - name: Signatur-Umgebung vorbereiten (optional)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Windows-Signatur aktiv."
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            # Apple-Notarisierung nur mitgeben, wenn macOS wirklich signiert wird
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
            echo "macOS-Signatur aktiv."
          else
            echo "Kein Zertifikat-Secret -> unsignierter Build."
          fi

      # Identisch zum bekannten gruenen Zustand (Standard-Shell, keine env-Manipulation).
      # Signatur greift nur, falls der vorige Schritt CSC_LINK gesetzt hat.
      - name: Build installer
        working-directory: desktop
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: apotrend-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  # Nur bei manuellem Start mit release=true: EIN Draft-Release mit allen
  # Installern. Separater Job -> keine Race-Conditions zwischen den OS-Builds.
  release:
    name: Draft-Release
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Alle Installer einsammeln
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Draft-Release erstellen/aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ApoTrend Desktop v1.0.0
          draft: true
          body: |
            Installierbare Desktop-Version von ApoTrend (gleicher Web-Kern wie die PWA).

            **Downloads:**
            - Windows: `.exe` (NSIS-Installer)
            - macOS: `.dmg`
            - Linux: `.AppImage` und `.deb`

            Unsigniert — Betriebssysteme können beim ersten Start eine Warnung zeigen.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
