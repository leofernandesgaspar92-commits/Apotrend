# Render.com Blueprint — 1-Klick-Deployment der ApoPulse Feed-App.
# Render erkennt diese Datei automatisch ("New + → Blueprint" auf render.com,
# dann dieses Repo wählen). Kostenloser Tarif genügt zum Ausprobieren.
#
# WICHTIG: Die neue App liegt im Unterordner server/ auf Branch feed-first.
# rootDir + branch sind deshalb explizit gesetzt.
#
# PERSISTENZ: Der Server kann seinen Zustand als JSON-Snapshot speichern
# (APOTREND_DATA_FILE). Damit die Datei einen Neustart/Deploy überlebt, braucht
# es eine dauerhafte Platte (Render "disk" — nur im Bezahltarif). Auf dem
# kostenlosen Tarif ist das Dateisystem flüchtig: Daten überleben zwar einen
# Prozess-Neustart innerhalb derselben Instanz, aber nicht ein neues Deploy.
# Für echten Dauerbetrieb / EU-Mehr-Instanz: Postgres hinter demselben Seam.

# ⚠️ WARUM HIER NOCH „apotrend" STEHT — BITTE NICHT „AUFRÄUMEN"
#
# Die App heißt inzwischen ApoPulse. Vier Dinge in dieser Datei tragen weiterhin
# den alten Namen, und zwar mit Absicht: Sie sind KEINE Beschriftung, sondern
# Schlüssel, unter denen bei Render echte Werte liegen.
#
#   name: apotrend-feed        Umbenennen legt bei Render einen NEUEN Dienst an —
#                              neue URL, alter Dienst bleibt verwaist zurück.
#   APOTREND_TOKEN_SECRET      generateValue: Ein neuer Schlüsselname erzeugt ein
#                              neues Geheimnis -> ALLE Nutzer:innen ausgeloggt.
#   APOTREND_ADMIN_PASSWORD    sync:false, also von Hand im Dashboard gesetzt.
#                              Unter neuem Namen ist der Wert leer -> kein
#                              Moderationszugang mehr, nicht wiederherstellbar.
#   APOTREND_DATA_FILE         Pfad des Snapshots. Ein anderer Pfad heißt für
#                              alle Beteiligten: „die Daten sind weg".
#
# Der Servercode liest beide Schreibweisen (src/env-compat.js) und bevorzugt
# APOPULSE_*. Die Umstellung ist damit jederzeit möglich, aber sie gehört in
# EINEN bewussten Schritt im Render-Dashboard — Werte zuerst unter dem neuen
# Namen anlegen, dann hier nachziehen —, nicht in ein Suchen-und-Ersetzen.
services:
  - type: web
    name: apotrend-feed
    runtime: node
    # Bezahlter Tarif (seit 10/2026, im Dashboard „0.5c-512mb"). Auf „free"
    # schlief der Dienst nach ~15 Min. ohne Besucher ein — dann liefen weder
    # News- noch Engpass-Abrufe, und die Engpass-Chronik bekam Löcher. Steht
    # hier wieder „free", stuft ein Blueprint-Abgleich den Dienst zurück.
    plan: starter
    # ⚠️ REGION — nachtraeglich NICHT aenderbar, und die haeufigste stille Falle.
    #
    # Render kann die Region eines bestehenden Dienstes nicht umziehen. Steht
    # sie hier nicht, waehlt Render eine Voreinstellung (Oregon) — und genau
    # das ist einmal passiert: Der Web-Dienst lief in Oregon, die Datenbanken
    # in Frankfurt. Die Internal Database URL gilt nur INNERHALB einer Region;
    # die Verbindung waere ohne jede Fehlermeldung schlicht nicht zustande
    # gekommen.
    #
    # Frankfurt ist ausserdem die fachlich richtige Wahl: Die Plattform
    # verarbeitet personenbezogene Daten oesterreichischer und deutscher
    # Apotheken. Diese in den USA zu speichern waere ein Drittlandtransfer,
    # der eine eigene Rechtsgrundlage braucht und in die
    # Datenschutzerklaerung gehoert. In der EU zu bleiben erspart die Frage.
    region: frankfurt
    branch: feed-first
    # Jeder Push auf feed-first löst automatisch ein neues Deploy aus
    # (explizit gesetzt statt auf Render-Default zu vertrauen).
    autoDeploy: true
    rootDir: server
    # --include=dev holt die Prisma-CLI (devDependency). Render setzt beim Build
    # teils NODE_ENV=production; ohne das Flag fehlte die CLI und db:setup fände
    # nichts vor. db:setup erzeugt den Client und spielt Migrationen ein — OHNE
    # DATABASE_URL überspringt es die Migrationen und lässt den Build grün
    # (die App läuft ohne Datenbank vollständig weiter). Siehe tools/db-setup.mjs.
    buildCommand: npm install --include=dev && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Snapshot-Persistenz aktivieren (Pfad unter /var/data = Render-Disk-Mountpoint).
      - key: APOTREND_DATA_FILE
        value: /var/data/apotrend.json
      # Redaktions-/Moderations-Login. E-Mail frei wählbar, Passwort in Render
      # als Secret setzen (sync:false -> Render fragt beim Deploy danach).
      - key: APOTREND_ADMIN_EMAIL
        value: redaktion@apotrend.at
      - key: APOTREND_ADMIN_PASSWORD
        sync: false
      # Stabiles Session-Secret: ohne diese Variable erhält jeder Neustart/Deploy
      # ein neues Zufalls-Secret -> alle Nutzer:innen werden ausgeloggt. Mit
      # generateValue erzeugt Render EINMAL ein festes Secret, das über Deploys bleibt.
      - key: APOTREND_TOKEN_SECRET
        generateValue: true
      # PostgreSQL. OPTIONAL: Ohne diese Variable läuft die App unverändert mit
      # In-Memory-Speicher + JSON-Snapshot. Mit ihr werden die automatisch
      # geholten Live-Daten (Behörden-News, Engpässe) zusätzlich dauerhaft
      # abgelegt — auf dem kostenlosen Tarif der einzige Weg, dass sie ein
      # Deploy überleben. Verbindungsstring in Render eintragen (sync:false).
      # Details und Grenzen: docs/DATENBANK.md.
      - key: DATABASE_URL
        sync: false
      # Wochenbericht per E-Mail (Premium, services/wochenbericht.js). Ohne die
      # drei Werte bleibt der Versand AUS — die App sagt das, statt still
      # nichts zu tun. Anbieter: resend oder postmark. Absender-Domain muss
      # beim Anbieter bestätigt sein (DNS-Einträge, die er vorgibt).
      - key: APOPULSE_MAIL_PROVIDER
        sync: false
      - key: APOPULSE_MAIL_API_KEY
        sync: false
      - key: APOPULSE_MAIL_FROM
        sync: false
      # Anzeigen: Rechnungssteller und Bank (ohne sie nur Krypto). docs/WERBUNG.md
      - key: APOPULSE_FIRMA_NAME
        sync: false
      - key: APOPULSE_FIRMA_ANSCHRIFT
        sync: false
      - key: APOPULSE_FIRMA_UST_ID
        sync: false
      - key: APOPULSE_BANK_IBAN
        sync: false
      - key: APOPULSE_UST_SATZ
        sync: false
      - key: APOPULSE_WERBEPREISE
        sync: false
      # Business-Tarif mit Daten-Schnittstelle, z. B. "monat:99,jahr:990" (EUR). Leer = Startpreise.
      - key: APOPULSE_PREISE_BUSINESS
        sync: false
      # Web-Push (Engpass-Alarm aufs Handy). Erzeugen mit: npm run vapid-schluessel
      - key: APOPULSE_VAPID_PUBLIC_KEY
        sync: false
      - key: APOPULSE_VAPID_PRIVATE_KEY
        sync: false
      # PORT wird von Render automatisch gesetzt — der Server liest process.env.PORT.
    # Dauerhafte Platte (nur Bezahltarif). Zum Aktivieren einkommentieren:
    # disk:
    #   name: apotrend-data
    #   mountPath: /var/data
    #   sizeGB: 1
