<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ApoPulse — Apotheker-Netzwerk</title>
<meta name="description" content="Fachnetzwerk für Apotheken: Feed, Lieferengpässe, Preise, Rabatte, News." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ApoPulse" />
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a href="#app" class="skiplink" id="skiplink" data-i18n="skiplink">Zum Inhalt springen</a>
<div id="offlineBanner" class="offline-banner hidden" role="status" aria-live="polite" data-i18n="offline_banner">📴 Keine Internetverbindung — Inhalte können nicht geladen werden.</div>
<div id="printhead"><h1 style="margin:0" data-i18n="print_head">ApoPulse — Lieferengpässe</h1><div id="printdate" style="color:#444"></div></div>
<header>
  <span class="logo clickable" id="logoHome" role="button" tabindex="0" data-i18n-title="logo_home" data-i18n-aria="logo_home" title="Zur Startseite" aria-label="Zur Startseite"><svg class="logo-ic" width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#0b7f28"/><path d="M13 6.2v13.6M6.2 13h13.6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></svg><span class="logo-txt">ApoPulse</span></span>
  <span class="muted" id="whoami"></span>
  <span class="sp"></span>
  <select class="hidden" id="countrySwitch" data-i18n-title="country_title" data-i18n-aria="country_title" title="Land wechseln (stellt auch die Sprache um)" aria-label="Land wechseln"></select>
  <!-- Kopf wie bei LinkedIn/X: Meldungen und Menü bleiben sichtbar (Symbol + Wort),
       alles Seltene steht im Menü — statt fünf umrandeter Knöpfe nebeneinander. -->
  <button class="kopf-btn bell hidden" id="btnNotif" data-i18n-aria="hdr_notif" data-i18n-title="hdr_notif" title="Benachrichtigungen" aria-label="Benachrichtigungen"><span class="ic" data-ic="bell"></span><span class="hlabel" data-i18n="hdr_notif">Meldungen</span><span class="badge hidden" id="notifBadge">0</span></button>
  <button class="kopf-btn" id="btnMenue" aria-haspopup="true" aria-expanded="false" aria-controls="kopfMenue" data-i18n-aria="hdr_menu"><span class="ic" data-ic="menu"></span><span class="hlabel" data-i18n="hdr_menu">Menü</span><span class="badge punkt hidden" id="menuBadge" aria-hidden="true"></span></button>
  <div class="kopf-menue" id="kopfMenue" role="menu" hidden>
    <button role="menuitem" class="bell hidden" id="btnMod" data-i18n-title="hdr_mod" title="Moderation"><span class="ic" data-ic="shield"></span><span class="hlabel" data-i18n="hdr_mod">Moderation</span></button>
    <button role="menuitem" class="bell hidden" id="btnDm" data-i18n-title="hdr_dm" title="Nachrichten"><span class="ic" data-ic="mail"></span><span class="hlabel" data-i18n="hdr_dm">Nachrichten</span><span class="badge hidden" id="dmBadge">0</span></button>
    <button role="menuitem" class="bell hidden" id="btnCart" data-i18n-title="cart_title" title="Einkaufsliste"><span class="ic" data-ic="cart"></span><span class="hlabel" data-i18n="cart_title">Einkaufsliste</span><span class="badge hidden" id="cartBadge">0</span></button>
    <button role="menuitem" id="btnTheme" data-i18n-title="aria_theme" title="Hell/Dunkel umschalten"><span class="ic" id="themeIcon" data-ic="moon"></span><span class="hlabel" id="themeLabel">Dunkel</span></button>
    <button role="menuitem" id="btnFont" data-i18n-title="font_label" title="Schriftgröße ändern"><span class="ic ic-text" id="fontIcon" aria-hidden="true">A</span><span class="hlabel" data-i18n="font_label">Schrift</span></button>
    <button role="menuitem" class="bell hidden" id="btnHelp" data-i18n-title="hdr_help" title="Hilfe"><span class="ic" data-ic="help"></span><span class="hlabel" data-i18n="hdr_help">Hilfe</span></button>
    <button role="menuitem" class="hidden" id="btnLogout" data-i18n-title="hdr_logout" title="Abmelden"><span class="ic" data-ic="logout"></span><span class="hlabel" data-i18n="hdr_logout">Abmelden</span></button>
  </div>
</header>
<!-- Rechte Spalte (Desktop, wie bei X): Schnellzugriff und News untereinander. -->
<div class="rechte-spalte" id="rechteSpalte">
  <aside id="quickRail" class="quick-rail" aria-label="Schnellzugriff"></aside>
  <aside id="newsRail" class="news-rail" aria-label="News-Livestream"></aside>
</div>
<main class="wrap" id="app" tabindex="-1" role="main"></main>

<!-- Sprachtexte VOR der Anwendung: app.js liest `I18N` beim Auswerten.
     Reihenfolge ist hier keine Kosmetik — sie ist die Abhaengigkeit. -->
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
