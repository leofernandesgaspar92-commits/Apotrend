<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ApoTrend — Apotheker-Netzwerk</title>
<meta name="description" content="Fachnetzwerk für Apotheken: Feed, Lieferengpässe, Preise, Rabatte, News." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#00a15a" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ApoTrend" />
<style>
  :root { --green:#00a15a; --green-d:#007a44; --bg:#f4f6f5; --card:#fff; --line:#e2e6e4; --text:#1a2420; --muted:#556860; }
  body.dark { --green:#1cc974; --green-d:#16a75f; --bg:#14181a; --card:#1e2427; --line:#33403b; --text:#e7ece9; --muted:#9fb0a8; }
  body.dark .reacts button, body.dark .spec { background:#2a3330; }
  body.dark input, body.dark textarea, body.dark select { background:#161b1d; }
  body.dark .editorial { background:#1e2f5a; color:#bcd0ff; border-color:#2e4680; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  /* Tastatur-Fokus deutlich sichtbar (Barrierefreiheit) */
  :focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
  header { background:var(--green); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  @media (max-width:560px){ #whoami { display:none; } header { gap:8px; padding:10px 12px; } }
  header .logo { font-weight:800; letter-spacing:.5px; font-size:1.25em; }
  header .sp { flex:1; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.5); min-height:42px; min-width:42px; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  h1 { font-size:1.4em; margin:0 0 12px; }
  label { display:block; font-size:0.9em; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:12px; border:1px solid var(--line); border-radius:8px; font-size:1em; font-family:inherit; min-height:46px; background:var(--card); color:var(--text); }
  textarea { resize:vertical; min-height:70px; }
  button { background:var(--green); color:#fff; border:none; border-radius:8px; padding:12px 16px; font-size:0.95em; font-weight:600; cursor:pointer; min-height:44px; }
  button:hover { background:var(--green-d); }
  button.ghost { background:transparent; color:var(--green); border:1px solid var(--green); }
  button.small { padding:7px 11px; font-size:0.85em; min-height:36px; }
  .row { display:flex; gap:8px; align-items:center; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; background:var(--card); color:var(--text); border:1px solid var(--line); }
  .tabs button.active { background:var(--green); color:#fff; border-color:var(--green); }
  .post-author { font-weight:700; }
  .handle { color:var(--muted); font-weight:400; font-size:0.9em; }
  .verified { color:var(--green); font-size:13px; }
  .editorial { background:#eef3ff; color:#2952cc; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid #cdd9ff; }
  .rank { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 6px; border-radius:999px; background:var(--green); color:#fff; font-weight:800; font-size:15px; margin-right:8px; }
  .rabatt-badge { background:#e6f7ef; color:#00885a; font-weight:800; font-size:16px; padding:4px 12px; border-radius:999px; border:1px solid #b6e6cf; }
  .mention { color:var(--green); font-weight:600; }
  .hashtag { color:#2952cc; font-weight:600; }
  .clickable { cursor:pointer; }
  .clickable:hover { text-decoration:underline; }
  .avatar { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:50%; background:var(--green); color:#fff; font-weight:800; font-size:19px; flex:0 0 auto; }
  .spec { display:inline-block; background:#eef3f0; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:13px; margin:2px 2px 2px 0; }
  .post-body { margin:8px 0; white-space:pre-wrap; line-height:1.45; }
  .vis { font-size:12px; color:var(--muted); }
  .reacts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .reacts button { background:#eef3f0; color:var(--text); border:1px solid var(--line); padding:7px 11px; font-size:0.85em; font-weight:500; min-height:36px; }
  .reacts button:hover { border-color:var(--green); }
  .muted { color:var(--muted); font-size:14px; }
  .err { color:#c0392b; font-size:14px; margin-top:8px; }
  .bell { position:relative; }
  .badge { position:absolute; top:-6px; right:-6px; background:#e02a2a; color:#fff; border-radius:10px; font-size:11px; padding:1px 6px; }
  .comments { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .comment { font-size:0.9em; padding:6px 0; border-bottom:1px solid var(--line); }
  .comment:last-child { border-bottom:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <span class="logo">🟢 ApoTrend</span>
  <span class="muted" id="whoami" style="color:#dff5ea;"></span>
  <span class="sp"></span>
  <button id="btnTheme" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten">🌙</button>
  <button id="btnFont" title="Schriftgröße ändern" aria-label="Schriftgröße ändern" style="font-weight:800">A⁺</button>
  <button class="bell hidden" id="btnHelp" title="Hilfe / So funktioniert ApoTrend" aria-label="Hilfe">❓</button>
  <button class="bell hidden" id="btnMod" title="Moderation" aria-label="Moderation">🛡️</button>
  <button class="bell hidden" id="btnDm" title="Nachrichten" aria-label="Nachrichten">✉️<span class="badge hidden" id="dmBadge">0</span></button>
  <button class="bell hidden" id="btnNotif" title="Benachrichtigungen" aria-label="Benachrichtigungen">🔔<span class="badge hidden" id="notifBadge">0</span></button>
  <button class="hidden" id="btnLogout">Abmelden</button>
</header>
<div class="wrap" id="app"></div>

<script>
// ── Schriftgröße (Barrierefreiheit): Normal / Groß / Sehr groß, gespeichert ──
const FONT_STEPS = [16, 19, 22];
const FONT_LABELS = ['A', 'A⁺', 'A⁺⁺'];
function applyFontScale() {
  const lvl = Math.max(0, Math.min(2, parseInt(localStorage.getItem('apo_fontscale') || '0', 10) || 0));
  document.body.style.fontSize = FONT_STEPS[lvl] + 'px';
  const btn = document.getElementById('btnFont');
  if (btn) { btn.textContent = FONT_LABELS[lvl]; btn.title = 'Schriftgröße: ' + ['Normal','Groß','Sehr groß'][lvl] + ' — tippen zum Wechseln'; }
}
// ── Hell/Dunkel-Modus (augenschonend), gespeichert ──
function applyTheme() {
  const dark = localStorage.getItem('apo_theme') === 'dark';
  document.body.classList.toggle('dark', dark);
  const btn = document.getElementById('btnTheme');
  if (btn) { btn.textContent = dark ? '☀️' : '🌙'; btn.title = dark ? 'Zu hellem Modus wechseln' : 'Zu dunklem Modus wechseln'; }
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', dark ? '#14181a' : '#00a15a');
}
const api = async (method, path, body) => {
  const t = localStorage.getItem('apo_token');
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type':'application/json', ...(t ? { Authorization:'Bearer '+t } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(data.error || ('Fehler '+r.status));
  return data;
};
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.childElementCount===1 ? t.content.firstElementChild : t.content; };
const esc = (s) => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Relative Zeit in Klartext (Owner-Vorgabe: keine kryptischen Kürzel).
// Bild lokal verkleinern (max. Kante ~1200px, JPEG) -> kleine data-URL, spart Speicher/Upload.
function fileToDataUrl(file, maxDim = 1200, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error('Bitte ein Bild wählen.'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Bild konnte nicht gelesen werden.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Bild ungültig.'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.round(width * scale); height = Math.round(height * scale);
        const c = document.createElement('canvas'); c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const relTime = (iso) => {
  if (!iso) return '';
  const d = new Date(iso), diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 45) return 'gerade eben';
  if (diff < 5400) { const m = Math.round(diff/60); return `vor ${m} Minute${m===1?'':'n'}`; }
  if (diff < 79200) { const h = Math.round(diff/3600); return `vor ${h} Stunde${h===1?'':'n'}`; }
  const days = Math.round(diff/86400);
  if (days < 7) return `vor ${days} Tag${days===1?'':'en'}`;
  return d.toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' });
};
// Text escapen UND @Handles + #Hashtags anklickbar machen (kein @ mitten in E-Mails).
const linkifyMentions = (s) => esc(s)
  .replace(/(^|[^\w@])@([a-z0-9_]{3,30})/gi,
    (m, pre, h) => `${pre}<span class="mention clickable" data-openprofile="${h}">@${h}</span>`)
  .replace(/(^|[^\w#])#([a-z0-9äöüß_]{2,30})/gi,
    (m, pre, t) => `${pre}<span class="hashtag clickable" data-hashtag="${t}">#${t}</span>`);
const app = document.getElementById('app');
let me = null, tab = 'overview', iAmModerator = false;
let myBookmarks = new Set();

// ── Auth-Screens ──
function authScreen() {
  document.getElementById('btnLogout').classList.add('hidden');
  document.getElementById('btnNotif').classList.add('hidden');
  document.getElementById('btnDm').classList.add('hidden');
  document.getElementById('btnMod').classList.add('hidden');
  document.getElementById('btnHelp').classList.add('hidden');
  document.getElementById('whoami').textContent = '';
  app.innerHTML = '';
  app.appendChild(el(`
  <div class="card">
    <h1>Anmelden</h1>
    <label>E-Mail</label><input id="li_email" type="email" placeholder="name@apotheke.at">
    <label>Passwort</label><input id="li_pw" type="password" placeholder="Passwort">
    <div style="margin-top:12px"><button id="li_go">Anmelden</button></div>
    <div class="err" id="li_err"></div>
  </div>
  <div class="card">
    <h1>Neu registrieren</h1>
    <label>Name</label><input id="rg_name" placeholder="Dr. Anna Huber">
    <label>@Handle (öffentlicher Name im Netzwerk)</label><input id="rg_handle" placeholder="anna_huber">
    <label>E-Mail</label><input id="rg_email" type="email" placeholder="name@apotheke.at">
    <label>Passwort (mind. 8 Zeichen)</label><input id="rg_pw" type="password">
    <div style="margin-top:12px"><button id="rg_go">Konto erstellen</button></div>
    <div class="err" id="rg_err"></div>
  </div>`));

  document.getElementById('li_go').onclick = async () => {
    try {
      const d = await api('POST','/api/login',{ email:v('li_email'), password:v('li_pw') });
      afterAuth(d);
    } catch(e){ document.getElementById('li_err').textContent = e.message; }
  };
  document.getElementById('rg_go').onclick = async () => {
    try {
      const d = await api('POST','/api/register',{ name:v('rg_name'), handle:v('rg_handle'), email:v('rg_email'), password:v('rg_pw') });
      afterAuth(d);
    } catch(e){ document.getElementById('rg_err').textContent = e.message; }
  };
}
const v = (id) => document.getElementById(id).value.trim();

function afterAuth(d) {
  localStorage.setItem('apo_token', d.token);
  me = d.profile || d.user;
  mainScreen();
}

// ── Haupt-Screen (Feed) ──
async function mainScreen() {
  const meData = await api('GET','/api/me');
  me = meData.profile;
  iAmModerator = !!meData.is_moderator;
  document.getElementById('whoami').textContent = me ? '@'+me.handle : '';
  document.getElementById('btnLogout').classList.remove('hidden');
  document.getElementById('btnNotif').classList.remove('hidden');
  document.getElementById('btnDm').classList.remove('hidden');
  const btnMod = document.getElementById('btnMod');
  btnMod.classList.toggle('hidden', !iAmModerator);
  btnMod.onclick = showModeration;
  const btnHelp = document.getElementById('btnHelp');
  btnHelp.classList.remove('hidden');
  btnHelp.onclick = () => showWelcome(true);
  document.getElementById('btnLogout').onclick = () => { localStorage.removeItem('apo_token'); location.reload(); };
  document.getElementById('btnNotif').onclick = showNotifications;
  document.getElementById('btnDm').onclick = showDmInbox;
  refreshNotifCount();
  refreshDmCount();
  try { myBookmarks = new Set((await api('GET','/api/bookmarks/ids')).ids); } catch { myBookmarks = new Set(); }

  app.innerHTML = '';
  app.appendChild(el(`
    <div class="card">
      <label>🔎 Suche (Personen, Beiträge, Engpässe, Preise, Rabatte)</label>
      <div class="row"><input id="sq" placeholder="z.B. Amoxicillin, Onkologie, @ben_mayer…"><button class="small" id="sgo">Suchen</button></div>
    </div>
    <div class="card">
      <label>Was gibt's Neues? (kurzer Fachbeitrag)</label>
      <textarea id="pb" placeholder="Bei uns gerade Engpass bei Amoxicillin — wer hat noch Bestand?"></textarea>
      <input id="psrc" placeholder="🔗 Quelle (Link, optional – z.B. BASG/Kammer)" style="margin-top:6px">
      <div class="row" style="margin-top:6px">
        <label class="ghost small" style="display:inline-flex;align-items:center;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:8px">📷 Bild<input type="file" id="pimg" accept="image/*" style="display:none"></label>
        <span class="muted" id="pimgname" style="font-size:13px"></span>
        <button class="ghost small" id="pimgclear" style="display:none">✕ entfernen</button>
      </div>
      <img id="pimgprev" style="display:none;max-width:100%;border-radius:8px;margin-top:6px" />
      <div class="row" style="margin-top:8px">
        <select id="pv" style="max-width:220px">
          <option value="public">🌍 Öffentlich (alle Apotheker)</option>
          <option value="followers">👥 Nur meine Follower</option>
        </select>
        <span class="sp" style="flex:1"></span>
        <button id="pgo">Posten</button>
      </div>
      <div class="err" id="perr"></div>
    </div>
    <div class="card">
      <label>Jemandem folgen (@Handle)</label>
      <div class="row"><input id="fh" placeholder="ben_mayer"><button class="ghost small" id="fgo">Folgen</button></div>
      <div class="err" id="ferr"></div>
    </div>
    <div class="tabs">
      <button data-tab="overview" class="active">✨ Für dich</button>
      <button data-tab="public">🌍 Öffentlich</button>
      <button data-tab="home">🏠 Mein Feed</button>
      <button data-tab="shortages">📦 Engpässe</button>
      <button data-tab="prices">💶 Preise</button>
      <button data-tab="rabatte">🏷️ Top-Rabatte</button>
      <button data-tab="exchange">🔄 Biete/Suche</button>
      <button data-tab="news">📰 News</button>
    </div>
    <div id="feed"></div>
  `));

  let composeImage = null;
  const pimg = document.getElementById('pimg'), pimgprev = document.getElementById('pimgprev');
  const pimgname = document.getElementById('pimgname'), pimgclear = document.getElementById('pimgclear');
  const clearImg = () => { composeImage = null; pimg.value=''; pimgprev.style.display='none'; pimgprev.src=''; pimgname.textContent=''; pimgclear.style.display='none'; };
  pimg.onchange = async () => {
    const f = pimg.files[0]; if (!f) return;
    try { composeImage = await fileToDataUrl(f); pimgprev.src = composeImage; pimgprev.style.display='block'; pimgname.textContent = f.name; pimgclear.style.display='inline-block'; document.getElementById('perr').textContent=''; }
    catch(e){ document.getElementById('perr').textContent = e.message; clearImg(); }
  };
  pimgclear.onclick = clearImg;
  document.getElementById('pgo').onclick = async () => {
    try {
      await api('POST','/api/posts',{ body:v('pb'), visibility:document.getElementById('pv').value, image:composeImage, sourceUrl:v('psrc') });
      document.getElementById('pb').value=''; document.getElementById('psrc').value=''; clearImg(); loadFeed();
    } catch(e){ document.getElementById('perr').textContent = e.message; }
  };
  document.getElementById('fgo').onclick = async () => {
    try { await api('POST','/api/follow',{ handle:v('fh') }); document.getElementById('fh').value=''; document.getElementById('ferr').textContent=''; loadFeed(); }
    catch(e){ document.getElementById('ferr').textContent = e.message; }
  };
  const runSearch = () => { const q = v('sq').trim(); if (q) renderSearch(q); };
  document.getElementById('sgo').onclick = runSearch;
  document.getElementById('sq').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    app.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); tab = b.dataset.tab; loadTab();
  });
  loadTab();
  // Deep-Link: /?post=ID öffnet direkt den Beitrag.
  const sharedPost = new URLSearchParams(location.search).get('post');
  if (sharedPost) { history.replaceState(null, '', location.pathname); openPost(sharedPost); }
  else if (!localStorage.getItem('apo_welcome_seen')) showWelcome(false);
}

function showWelcome(reopened) {
  document.getElementById('welcomeOverlay')?.remove();
  const steps = [
    ['📝', 'Posten & austauschen', 'Kurz teilen, was gerade wichtig ist — z.B. „Engpass bei Amoxicillin, wer hat Bestand?". Andere reagieren und antworten.'],
    ['🔄', 'Biete & Suche (Bestandsaustausch)', 'Überbestand abzugeben oder etwas dringend gesucht? Im Reiter „Biete/Suche" eintragen — Kontakt läuft diskret per Direktnachricht.'],
    ['👥', 'Kolleg:innen folgen', 'Folge anderen Apotheker:innen (@Handle) und sieh ihre Beiträge in „Mein Feed".'],
    ['📦', 'Engpässe, 💶 Preise, 🏷️ Rabatte, 📰 News', 'Aktuelle Marktdaten in den Reitern oben — direkt aus einem Eintrag heraus dazu posten.'],
    ['✉️', 'Direktnachrichten', 'Schreib jemandem privat 1:1 über das Briefsymbol oben oder „✉️ Nachricht" am Profil.'],
    ['🔎', 'Suchen & 🏷️ Themen', 'Oben nach Personen, Beiträgen, Wirkstoffen suchen. #Hashtags und @Namen sind anklickbar.'],
  ];
  const ov = el(`<div id="welcomeOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px">
    <div class="card" style="max-width:520px;width:100%;max-height:90vh;overflow-y:auto">
      <div class="row"><h1 style="flex:1;margin:0">👋 Willkommen bei ApoTrend</h1></div>
      <p class="muted" style="margin:6px 0 14px">Das Fachnetzwerk für Apotheken — kurz erklärt:</p>
      ${steps.map(([i,t,d])=>`<div style="display:flex;gap:12px;margin:12px 0">
        <div style="font-size:24px;flex:0 0 auto">${i}</div>
        <div><b>${esc(t)}</b><div class="muted" style="font-size:14px;margin-top:2px">${esc(d)}</div></div></div>`).join('')}
      <div class="card" style="background:#eef6f1;border-color:#cfe6da;margin-top:8px">
        <b>📲 Tipp: Als App installieren</b>
        <div class="muted" style="font-size:14px;margin-top:4px">
          Handy: Browser-Menü → „Zum Startbildschirm" (iPhone: Teilen → „Zum Home-Bildschirm").
          Computer: Installations-Symbol rechts in der Adressleiste. Dann liegt ApoTrend wie eine App auf deinem Gerät.
        </div>
      </div>
      <div class="row" style="margin-top:16px"><span class="sp" style="flex:1"></span>
        <button id="welcomeClose">Los geht's →</button></div>
    </div>
  </div>`);
  document.body.appendChild(ov);
  const close = () => { localStorage.setItem('apo_welcome_seen','1'); ov.remove(); };
  ov.querySelector('#welcomeClose').onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
}

function goTab(name) {
  tab = name;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  const b = document.querySelector('.tabs button[data-tab="'+name+'"]'); if (b) b.classList.add('active');
  loadTab();
}

async function loadOverview() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="muted">lädt…</div>';
  let d;
  try { d = await api('GET','/api/overview'); }
  catch(e){ feed.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; return; }
  feed.innerHTML = '';
  const hello = me ? (me.display_name || '@'+me.handle) : '';
  const firstName = hello ? (hello.split(/\s+/).find(w => !/\.$/.test(w)) || hello) : '';
  // Kennzahlen-Kacheln
  const tile = (icon, num, label, col, go) => `<div class="ovtile" data-go="${go||''}" style="flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;${go?'cursor:pointer':''}">
    <div style="font-size:26px;font-weight:800;color:${col}">${icon} ${num}</div>
    <div class="muted" style="font-size:13px;margin-top:2px">${esc(label)}</div></div>`;
  const head = el(`<div class="card">
    <h1 style="margin:0 0 2px">✨ Für dich${firstName?', '+esc(firstName):''}</h1>
    <div class="muted" style="margin-bottom:12px">Das Wichtigste auf einen Blick.</div>

      ${tile('🔴', d.shortages.kritisch, 'kritische Engpässe', '#c0392b', 'shortages')}
      ${tile('📦', d.exchange.biete, 'Angebote im Austausch', '#00885a', 'exchange')}
      ${tile('🔎', d.exchange.suche, 'Gesuche im Austausch', '#b26a00', 'exchange')}
      ${tile('🔔', d.notifications.unread, 'neue Benachrichtigungen', '#2952cc', '')}

  head.querySelector('#ov_bm').onclick = openBookmarks;
  feed.appendChild(head);

  // Kritische Engpässe (Top 3)
  if (d.shortages.top.length) {
    const c = el(`<div class="card"><div class="row"><b>🔴 Kritische Engpässe</b><span class="sp" style="flex:1"></span><button class="ghost small" data-all>Alle ansehen</button></div>

    c.querySelector('[data-all]').onclick = () => goTab('shortages');
    feed.appendChild(c);
  }
  // Neueste Austausch-Einträge
  if (d.exchange.recent.length) {
    const c = el(`<div class="card"><div class="row"><b>🔄 Zuletzt im Bestandsaustausch</b><span class="sp" style="flex:1"></span><button class="ghost small" data-all>Zum Austausch</button></div></div>`);
    c.querySelector('[data-all]').onclick = () => goTab('exchange');
    d.exchange.recent.forEach(e => c.appendChild(exchangeCard(e)));
    feed.appendChild(c);
  }
  // Top-Rabatt
  if (d.top_rabatt) {
    const r = d.top_rabatt;
    const c = el(`<div class="card"><div class="row"><b>🏷️ Top-Rabatt gerade</b><span class="sp" style="flex:1"></span><button class="ghost small" data-all>Alle Rabatte</button></div>

    c.querySelector('[data-all]').onclick = () => goTab('rabatte');
    feed.appendChild(c);
  }
}

function loadTab() {
  if (tab === 'overview') return loadOverview();
  if (tab === 'shortages') return loadShortages();
  if (tab === 'prices') return loadPrices();
  if (tab === 'rabatte') return loadRabatte();
  if (tab === 'exchange') return loadExchange();
  if (tab === 'news') return loadNews();
  loadFeed();
}

async function loadNews() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  feed.appendChild(el(`<div class="card">
    <label>News teilen (Kammer-Mitteilung, Gesetzesänderung, Branchennews …)</label>
    <textarea id="nb" placeholder="Regulatorische/fachliche News, die für Kolleg:innen relevant ist…"></textarea>

    <div class="row" style="margin-top:6px">
      <label class="ghost small" style="display:inline-flex;align-items:center;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:8px">📷 Bild<input type="file" id="nimg" accept="image/*" style="display:none"></label>
      <span class="muted" id="nimgname" style="font-size:13px"></span>
      <button class="ghost small" id="nimgclear" style="display:none">✕</button>
    </div>
    <img id="nimgprev" style="display:none;max-width:100%;border-radius:8px;margin-top:6px" />
    <div style="margin-top:8px"><button id="ngo">Als News teilen</button></div>
    <div class="err" id="nerr"></div>
  </div><div id="newslist"></div>`));
  let newsImage = null;
  const nimg = document.getElementById('nimg'), nimgprev = document.getElementById('nimgprev');
  const nimgname = document.getElementById('nimgname'), nimgclear = document.getElementById('nimgclear');
  const clearN = () => { newsImage=null; nimg.value=''; nimgprev.style.display='none'; nimgprev.src=''; nimgname.textContent=''; nimgclear.style.display='none'; };
  nimg.onchange = async () => {
    const f = nimg.files[0]; if (!f) return;
    try { newsImage = await fileToDataUrl(f); nimgprev.src=newsImage; nimgprev.style.display='block'; nimgname.textContent=f.name; nimgclear.style.display='inline-block'; document.getElementById('nerr').textContent=''; }
    catch(e){ document.getElementById('nerr').textContent = e.message; clearN(); }
  };
  nimgclear.onclick = clearN;
  document.getElementById('ngo').onclick = async () => {
    const t = document.getElementById('nb');
    if (!t.value.trim() && !newsImage) { document.getElementById('nerr').textContent='Text oder Bild nötig.'; return; }
    try { await api('POST','/api/posts',{ body:t.value, kind:'news', visibility:'public', image:newsImage, sourceUrl:v('nsrc') }); t.value=''; document.getElementById('nsrc').value=''; clearN(); loadNews(); }
    catch(e){ document.getElementById('nerr').textContent = e.message; }
  };
  const list = document.getElementById('newslist');
  list.innerHTML = '<div class="muted">lädt…</div>';
  try {
    const d = await api('GET','/api/news');
    list.innerHTML = '';
    if (!d.posts.length) { list.innerHTML = '<div class="card muted">Noch keine News.</div>'; return; }
    d.posts.forEach(p => list.appendChild(postCard(p)));
  } catch(e){ list.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; }
}

const BUNDESLAENDER = ['Wien','Niederösterreich','Oberösterreich','Steiermark','Tirol','Kärnten','Salzburg','Vorarlberg','Burgenland'];
const blOptions = (sel) => BUNDESLAENDER.map(b=>`<option value="${b}"${b===sel?' selected':''}>${b}</option>`).join('');
let exchangeFilter = ''; // '', 'biete', 'suche'
let exchangeQuery = '';   // Text-Filter (z.B. aus einem Engpass heraus vorbelegt)
let exchangeBL = '';      // Bundesland-Filter
let exchangeMine = false;  // nur eigene Einträge (inkl. erledigte)
async function loadExchange() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  // Formular zum Anlegen
  const form = el(`<div class="card">
    <label>🔄 Bestandsaustausch — Biete Überbestand oder Suche dringend</label>
    <div class="row" style="margin-top:6px">
      <select id="ex_kind" style="max-width:150px"><option value="biete">📦 Ich biete</option><option value="suche">🔎 Ich suche</option></select>
      <input id="ex_bez" placeholder="Präparat / Wirkstoff, z.B. Amoxicillin 1000 mg" style="flex:1">
    </div>
    <div class="row" style="margin-top:6px">
      <input id="ex_menge" placeholder="Menge (z.B. 20 Packungen)">
      <input id="ex_ort" placeholder="Ort (z.B. 1010 Wien)">
    </div>
    <select id="ex_bl" style="margin-top:6px"><option value="">Bundesland wählen (für Umkreis-Suche)…</option>${blOptions('')}</select>
    <input id="ex_note" placeholder="Hinweis (optional)" style="margin-top:6px">
    <div class="row" style="margin-top:6px">
      <label class="ghost small" style="display:inline-flex;align-items:center;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:8px">📷 Foto (z.B. Charge/Ablauf)<input type="file" id="ex_img" accept="image/*" style="display:none"></label>
      <span class="muted" id="ex_imgname" style="font-size:13px"></span>
      <button class="ghost small" id="ex_imgclear" style="display:none">✕</button>
    </div>
    <img id="ex_imgprev" style="display:none;max-width:100%;border-radius:8px;margin-top:6px" />
    <div class="row" style="margin-top:8px"><button id="ex_go">Eintrag veröffentlichen</button><span class="err" id="ex_err" style="margin-left:10px"></span></div>
    <div class="muted" style="font-size:13px;margin-top:6px">Kontakt läuft über Direktnachricht — keine öffentlichen Kontaktdaten.</div>
  </div>`);
  feed.appendChild(form);
  let exImage = null;
  const exImg = document.getElementById('ex_img'), exImgprev = document.getElementById('ex_imgprev');
  const exImgname = document.getElementById('ex_imgname'), exImgclear = document.getElementById('ex_imgclear');
  const clearEx = () => { exImage=null; exImg.value=''; exImgprev.style.display='none'; exImgprev.src=''; exImgname.textContent=''; exImgclear.style.display='none'; };
  exImg.onchange = async () => {
    const f = exImg.files[0]; if (!f) return;
    try { exImage = await fileToDataUrl(f); exImgprev.src=exImage; exImgprev.style.display='block'; exImgname.textContent=f.name; exImgclear.style.display='inline-block'; document.getElementById('ex_err').textContent=''; }
    catch(e){ document.getElementById('ex_err').textContent = e.message; clearEx(); }
  };
  exImgclear.onclick = clearEx;
  document.getElementById('ex_go').onclick = async () => {
    try {
      await api('POST','/api/exchange',{ kind:v('ex_kind'), bezeichnung:v('ex_bez'), menge:v('ex_menge'), ort:v('ex_ort'), bundesland:v('ex_bl'), note:v('ex_note'), image:exImage });
      loadExchange();
    } catch(e){ document.getElementById('ex_err').textContent = e.message; }
  };
  // Filter + Textsuche
  const filt = el(`<div class="card" style="padding:8px 12px">
    <div class="row"><input id="ex_q" placeholder="Nach Präparat filtern…" value="${esc(exchangeQuery)}"><button class="ghost small" id="ex_qgo">Filtern</button>${exchangeQuery?'<button class="ghost small" id="ex_qclear">✕</button>':''}</div>
    <div class="reacts" style="margin-top:6px">
      <button class="${!exchangeMine&&exchangeFilter===''?'':'ghost '}small" data-f="">Alle</button>
      <button class="${!exchangeMine&&exchangeFilter==='biete'?'':'ghost '}small" data-f="biete">📦 Angebote</button>
      <button class="${!exchangeMine&&exchangeFilter==='suche'?'':'ghost '}small" data-f="suche">🔎 Gesuche</button>
      <button class="${exchangeMine?'':'ghost '}small" data-mine>🗂️ Meine</button>
      <select id="ex_blf" class="small" style="margin-left:auto" ${exchangeMine?'disabled':''}><option value="">📍 Alle Bundesländer</option>${blOptions(exchangeBL)}</select>
    </div></div>`);
  filt.querySelectorAll('[data-f]').forEach(btn => btn.onclick = () => { exchangeMine=false; exchangeFilter = btn.dataset.f; loadExchange(); });
  filt.querySelector('[data-mine]').onclick = () => { exchangeMine = !exchangeMine; loadExchange(); };
  filt.querySelector('#ex_qgo').onclick = () => { exchangeQuery = v('ex_q').trim(); loadExchange(); };
  filt.querySelector('#ex_q').addEventListener('keydown', e => { if (e.key==='Enter') { exchangeQuery = v('ex_q').trim(); loadExchange(); } });
  const blf = filt.querySelector('#ex_blf'); if (blf) blf.onchange = (ev) => { exchangeBL = ev.target.value; loadExchange(); };
  const qclear = filt.querySelector('#ex_qclear');
  if (qclear) qclear.onclick = () => { exchangeQuery=''; loadExchange(); };
  feed.appendChild(filt);
  try {
    let d;
    if (exchangeMine) {
      d = await api('GET','/api/exchange/mine');
      if (!d.entries.length) { feed.appendChild(el('<div class="card muted">Du hast noch keine Einträge angelegt.</div>')); return; }
    } else {
      const params = new URLSearchParams();
      if (exchangeFilter) params.set('kind', exchangeFilter);
      if (exchangeQuery) params.set('q', exchangeQuery);
      if (exchangeBL) params.set('bundesland', exchangeBL);
      d = await api('GET','/api/exchange'+(params.toString()?'?'+params.toString():''));
      if (!d.entries.length) { feed.appendChild(el(`<div class="card muted">${exchangeQuery?`Keine offenen Einträge zu „${esc(exchangeQuery)}".`:'Noch keine offenen Einträge. Sei der/die Erste!'}</div>`)); return; }
    }
    d.entries.forEach(e => feed.appendChild(exchangeCard(e)));
  } catch(e){ feed.appendChild(el('<div class="card err">'+esc(e.message)+'</div>')); }
}

function exchangeCard(e) {
  const au = e.author || {};
  const mine = me && au.handle === me.handle;
  const isBiete = e.kind === 'biete';
  const badge = isBiete ? '<span style="background:#e6f7ef;color:#00885a;border:1px solid #b6e6cf;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px">📦 Biete</span>'
                        : '<span style="background:#fff4e6;color:#b26a00;border:1px solid #ffd9a8;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px">🔎 Suche</span>';
  const erledigt = e.status === 'erledigt';
  const doneBadge = erledigt ? ' <span style="background:var(--line);color:var(--muted);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600">✓ erledigt</span>' : '';
  const card = el(`<div class="card"${erledigt?' style="opacity:.75"':''}>
    <div class="row" style="align-items:baseline">
      ${badge}${doneBadge}
      <b style="margin-left:8px">${esc(e.bezeichnung)}</b>
      <span class="sp" style="flex:1"></span>
      <span class="muted" style="font-size:12px">${relTime(e.created_at)}</span>
    </div>
    <div class="muted" style="margin-top:4px">${e.menge?'Menge: '+esc(e.menge):''}${e.menge&&(e.ort||e.bundesland)?' · ':''}${e.ort||e.bundesland?'📍 '+esc([e.ort,e.bundesland].filter(Boolean).join(', ')):''}</div>
    ${e.note?`<div class="post-body" style="margin:6px 0">${esc(e.note)}</div>`:''}
    ${e.image && /^data:image\//.test(e.image) ? `<img src="${e.image}" alt="Foto zum Eintrag" style="max-width:100%;border-radius:10px;margin-top:6px;display:block" />` : ''}
    <div class="row" style="margin-top:8px;align-items:baseline">
      <span class="handle clickable" data-openprofile="${esc(au.handle||'')}">von ${esc(au.display_name||'Unbekannt')} @${esc(au.handle||'?')}</span>
      <span class="sp" style="flex:1"></span>
      ${!mine ? '<button class="small" data-contact>✉️ Kontaktieren</button>'
              : (erledigt ? '<button class="ghost small" data-reopen>↻ Wieder öffnen</button><button class="ghost small" data-del>🗑</button>'
                          : '<button class="ghost small" data-done>✓ Erledigt</button><button class="ghost small" data-del>🗑</button>')}
    </div>
  </div>`);
  card.querySelectorAll('[data-openprofile]').forEach(el => { if (el.dataset.openprofile) el.onclick = () => openProfile(el.dataset.openprofile); });
  const contact = card.querySelector('[data-contact]');
  if (contact) contact.onclick = async () => {
    try { const r = await api('POST','/api/dm/start',{ handle: au.handle }); openDmThread(r.thread.id); } catch(err){ alert(err.message); }
  };
  const done = card.querySelector('[data-done]');
  if (done) done.onclick = async () => { try { await api('POST',`/api/exchange/${e.id}/resolve`); loadExchange(); } catch(err){ alert(err.message); } };
  const reopen = card.querySelector('[data-reopen]');
  if (reopen) reopen.onclick = async () => { try { await api('POST',`/api/exchange/${e.id}/reopen`); loadExchange(); } catch(err){ alert(err.message); } };
  const del = card.querySelector('[data-del]');
  if (del) del.onclick = async () => { if (!confirm('Eintrag löschen?')) return; try { await api('POST',`/api/exchange/${e.id}/delete`); loadExchange(); } catch(err){ alert(err.message); } };
  return card;
}

    <div class="row" style="margin-top:8px">
      <span class="muted">${r.post_count||0} Beiträge dazu</span>

    </div>
  </div>`);

  card.querySelector('[data-ppsend]').onclick = async () => {

const REACTS = [['hilfreich','👍 Hilfreich'],['danke','🙏 Danke'],['bestaetigt','✅ Bestätigt'],['interessant','💡 Interessant']];

function refChip(r) {
  if (!r) return '';
  const base = 'background:#eef3f0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:4px';
  if (r.kind === 'price') {
    const t = r.trend_pct>0?` ▲ +${r.trend_pct}%`:(r.trend_pct<0?` ▼ ${r.trend_pct}%`:'');
    return `<div class="vis" style="${base}">💶 Preis: <b>${esc(r.bezeichnung)}</b> — ${esc(r.supplier)} € ${Number(r.aep).toFixed(2)}${t}</div>`;
  }
  if (r.kind === 'rabatt') {
    return `<div class="vis" style="${base}">🏷️ Aktion: <b>${esc(r.bezeichnung)}</b> — ${esc(r.supplier)} € ${Number(r.aktionspreis).toFixed(2)} <span style="color:#00885a">−${r.rabatt_pct}%</span> · gültig bis ${esc(r.gueltig_bis)}</div>`;
  }
  return `<div class="vis" style="${base}">📦 Engpass: <b>${esc(r.wirkstoff)}</b> — ${esc(r.bezeichnung)}</div>`;
}

async function loadFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="muted">lädt…</div>';
  try {
    const d = await api('GET', tab==='home' ? '/api/feed/home' : '/api/feed/public');
    feed.innerHTML = '';
    if (!d.posts.length) {
      feed.appendChild(el(`<div class="card muted">${tab==='home'?'Dein Feed ist noch leer. Folge Kolleg:innen, um ihre Beiträge zu sehen:':'Noch keine Beiträge. Sei der/die Erste!'}</div>`));
      if (tab==='home') await renderSuggestions(feed);
      return;
    }
    d.posts.forEach(p => feed.appendChild(postCard(p)));
  } catch(e){ feed.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; }
}

async function renderSearch(q) {
  const feed = document.getElementById('feed');
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  feed.innerHTML = '<div class="muted">suche…</div>';
  try {
    const d = await api('GET','/api/search?q='+encodeURIComponent(q));
    feed.innerHTML = '';
    const head = el(`<div class="card"><div class="row"><b>Suchergebnisse für „${esc(d.query)}"</b><span class="sp" style="flex:1"></span><span class="muted">${d.total} Treffer</span><button class="ghost small" data-back style="margin-left:10px">← zurück</button></div></div>`);
    head.querySelector('[data-back]').onclick = () => { tab='public'; document.querySelector('.tabs button[data-tab="public"]').classList.add('active'); loadTab(); };
    feed.appendChild(head);
    if (!d.total) { feed.appendChild(el('<div class="card muted">Keine Treffer. Andere Schreibweise probieren?</div>')); return; }
    const section = (title) => feed.appendChild(el(`<div class="muted" style="margin:14px 2px 4px;font-weight:700">${title}</div>`));
    if (d.people.length) {
      section('👥 Personen');
      d.people.forEach(p => {
        const specs = (p.specializations||[]).map(s=>`<span class="spec">${esc(s)}</span>`).join(' ');
        const card = el(`<div class="card"><div class="row">
          <span class="post-author clickable" data-openprofile="${esc(p.handle)}">${esc(p.display_name)}</span>
          <span class="handle clickable" data-openprofile="${esc(p.handle)}">@${esc(p.handle)}</span>
          ${p.is_editorial?'<span class="editorial">📰 Redaktion</span>':''}
          ${p.verified?'<span class="verified">✔ verifiziert</span>':''}
        </div>${specs?`<div style="margin-top:6px">${specs}</div>`:''}</div>`);
        card.querySelectorAll('[data-openprofile]').forEach(el => el.onclick = () => openProfile(el.dataset.openprofile));
        feed.appendChild(card);
      });
    }
    if (d.posts.length) { section('📝 Beiträge'); d.posts.forEach(p => feed.appendChild(postCard(p))); }
    if (d.shortages.length) { section('📦 Engpässe'); d.shortages.forEach(s => feed.appendChild(shortageCard(s))); }
    if (d.prices.length) {
      section('💶 Preise');
      d.prices.forEach(pr => feed.appendChild(el(`<div class="card"><div class="row">
        <span class="post-author">${esc(pr.bezeichnung)}</span><span class="handle">${esc(pr.wirkstoff||'')}</span>
        <span class="sp" style="flex:1"></span><span><b>€ ${Number(pr.aep).toFixed(2)}</b> ${trendStr(pr.trend_pct)}</span></div>
        <div class="muted">${esc(pr.supplier)} · ${esc(PROV[pr.provenance]||pr.provenance)}</div></div>`)));
    }
    if (d.rabatte.length) { section('🏷️ Rabatt-Aktionen'); d.rabatte.forEach((r,i) => { r.rank = i+1; feed.appendChild(rabattCard(r)); }); }
  } catch(e){ feed.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; }
}

      </div>
    </div>`);

    const eb = head.querySelector('[data-edit]');

    if (tf) tf.onclick = async () => {
      try { await api('POST', d.is_following?'/api/unfollow':'/api/follow', { handle:p.handle }); openProfile(handle); }
      catch(e){ alert(e.message); }
    };
    const dmb = head.querySelector('[data-dm]');
    if (dmb) dmb.onclick = async () => {
      try { const r = await api('POST','/api/dm/start',{ handle:p.handle }); openDmThread(r.thread.id); }
      catch(e){ alert(e.message); }
    };
    feed.appendChild(head);
    if (d.is_self && !p.verified) {
      const vcard = el('<div class="card"></div>');
      feed.appendChild(vcard);
      renderVerifyCard(vcard);
    }
    if (d.is_self) {
      const dcard = el(`<div class="card"><b>🔒 Datenschutz & Konto</b>
        <div class="muted" style="margin-top:4px">Lade alle deine Daten (Profil, Beiträge, Kommentare, Nachrichten, Merkliste, Austausch) als Datei herunter (DSGVO).</div>
        <div style="margin-top:8px"><button class="ghost small" id="dl_export">⬇️ Meine Daten exportieren</button></div>
        <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
          <b style="font-size:0.95em">Passwort ändern</b>
          <input id="pw_old" type="password" placeholder="Aktuelles Passwort" style="margin-top:6px">
          <input id="pw_new" type="password" placeholder="Neues Passwort (mind. 8 Zeichen)" style="margin-top:6px">
          <div class="row" style="margin-top:8px"><button class="small" id="pw_go">Passwort ändern</button><span id="pw_msg" style="margin-left:8px"></span></div>
        </div>
        <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
          <b style="font-size:0.95em;color:#c0392b">Konto löschen</b>
          <div class="muted" style="margin-top:4px">Unwiderruflich: alle deine Daten (Profil, Beiträge, Kommentare, Nachrichten, Austausch) werden gelöscht.</div>
          <div class="row" style="margin-top:8px"><button class="ghost small" id="acc_del" style="color:#c0392b;border-color:#c0392b">Konto endgültig löschen</button></div>
        </div></div>`);
      dcard.querySelector('#acc_del').onclick = async () => {
        if (!confirm('Dein Konto und alle Daten werden unwiderruflich gelöscht. Fortfahren?')) return;
        const pwd = prompt('Zur Bestätigung dein Passwort eingeben:');
        if (!pwd) return;
        try { await api('POST','/api/me/delete',{ password: pwd }); alert('Dein Konto wurde gelöscht.'); localStorage.removeItem('apo_token'); location.reload(); }
        catch(e){ alert(e.message); }
      };
      dcard.querySelector('#pw_go').onclick = async () => {
        const msg = dcard.querySelector('#pw_msg');
        try { await api('POST','/api/me/password',{ oldPassword:v('pw_old'), newPassword:v('pw_new') });
          msg.style.color='var(--green)'; msg.textContent='✓ Passwort geändert'; dcard.querySelector('#pw_old').value=''; dcard.querySelector('#pw_new').value='';
        } catch(e){ msg.style.color='#c0392b'; msg.textContent=e.message; }
      };
      dcard.querySelector('#dl_export').onclick = async () => {
        try {
          const data = await api('GET','/api/me/export');
          const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url; link.download = 'apotrend-meine-daten.json'; link.click();
          URL.revokeObjectURL(url);
        } catch(e){ alert(e.message); }
      };
      feed.appendChild(dcard);
    }
    if (!d.posts.length) feed.appendChild(el('<div class="card muted">Noch keine sichtbaren Beiträge.</div>'));
    d.posts.forEach(post => feed.appendChild(postCard(post)));
  } catch(e){ feed.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; }
}

async function renderVerifyCard(card) {
  let s; try { s = await api('GET','/api/verify/me'); } catch { return; }
  if (s.status === 'verifiziert') { card.remove(); return; }
  if (s.status === 'offen') {
    card.innerHTML = '<b>✔ Verifizierung</b><div class="muted" style="margin-top:4px">Dein Antrag wird von der Redaktion geprüft. Du wirst benachrichtigt.</div>';
    return;
  }
  const abgelehnt = s.status === 'abgelehnt';
  card.innerHTML = `<b>✔ Verifiziert werden</b>
    <div class="muted" style="margin-top:4px">${abgelehnt?'Dein letzter Antrag wurde abgelehnt. ':''}Weise deine Apotheke nach (z.B. Konzessionsnummer, Apothekenname, Ort) — die Redaktion prüft es. Verifizierte Profile genießen mehr Vertrauen.</div>
    <input id="vf_note" placeholder="z.B. Konzession 12345, Apotheke Zum Hirschen, 1010 Wien" style="margin-top:8px">
    <div class="row" style="margin-top:8px"><button id="vf_go">Verifizierung beantragen</button><span class="err" id="vf_err" style="margin-left:8px"></span></div>`;
  card.querySelector('#vf_go').onclick = async () => {
    try { await api('POST','/api/verify/request',{ note: v('vf_note') }); renderVerifyCard(card); }
    catch(e){ card.querySelector('#vf_err').textContent = e.message; }
  };
}

  if (sh) sh.onclick = async () => {
    const url = location.origin + '/?post=' + encodeURIComponent(p.id);
    try { await navigator.clipboard.writeText(url); sh.textContent = '✓ kopiert'; setTimeout(()=>{ sh.textContent='🔗 Teilen'; }, 1500); }
    catch { prompt('Link zum Beitrag:', url); }
  };
  const bm = card.querySelector('[data-bookmark]');
  if (bm) bm.onclick = async () => {
    try {
      const r = await api('POST',`/api/posts/${p.id}/bookmark`);
      if (r.bookmarked) myBookmarks.add(p.id); else myBookmarks.delete(p.id);
      bm.textContent = r.bookmarked ? '🔖 gemerkt' : '🔖 Merken';
    } catch(e){ alert(e.message); }
  };
  const delb = card.querySelector('[data-del]');
  if (delb) delb.onclick = async () => {
    if (!confirm('Diesen Beitrag wirklich löschen?')) return;
    try { await api('POST',`/api/posts/${p.id}/delete`); card.remove(); } catch(e){ alert(e.message); }
  };
  const editb = card.querySelector('[data-edit]');
  if (editb) editb.onclick = () => {
    const bodyEl = card.querySelector('[data-body]');
    if (card.querySelector('[data-editbox]')) return; // schon offen
    const cur = bodyEl.textContent;
    const box = el(`<div data-editbox style="margin:8px 0">
      <textarea data-eb>${esc(cur)}</textarea>
      <div class="row" style="margin-top:6px"><button class="small" data-ebsave>Speichern</button><button class="ghost small" data-ebcancel>Abbrechen</button><span class="err" data-eberr style="margin-left:8px"></span></div>
    </div>`);
    bodyEl.style.display = 'none';
    bodyEl.after(box);
    box.querySelector('[data-ebcancel]').onclick = () => { box.remove(); bodyEl.style.display = ''; };
    box.querySelector('[data-ebsave]').onclick = async () => {
      const nv = box.querySelector('[data-eb]').value;
      try {
        const r = await api('POST',`/api/posts/${p.id}/edit`,{ body: nv });
        bodyEl.textContent = r.body;
        card.querySelector('[data-edited]').style.display = '';
        box.remove(); bodyEl.style.display = '';
      } catch(e){ box.querySelector('[data-eberr]').textContent = e.message; }
    };
  };
  const repb = card.querySelector('[data-report]');
  if (repb) repb.onclick = async () => {
    const reason = prompt('Warum meldest du diesen Beitrag? (optional)') ?? '';
    if (reason === null) return;
    try { await api('POST',`/api/posts/${p.id}/report`,{ reason }); alert('Danke — der Beitrag wurde der Moderation gemeldet.'); }
    catch(e){ alert(e.message); }
  };
  const cbtn = card.querySelector('[data-comments]');
  const cbox = card.querySelector('[data-cbox]');
  cbtn.onclick = async () => {
    cbox.classList.toggle('hidden');
    if (!cbox.classList.contains('hidden')) loadComments(p.id, card);
  };
  card.querySelector('[data-csend]').onclick = async () => {
    const inp = card.querySelector('[data-cinput]');
    if (!inp.value.trim()) return;
    try { await api('POST',`/api/posts/${p.id}/comments`,{ body:inp.value }); inp.value=''; loadComments(p.id, card); } catch(e){ alert(e.message); }
  };
  return card;
}

async function loadComments(postId, card) {
  const list = card.querySelector('[data-clist]');
  list.innerHTML = '<div class="muted">lädt…</div>';
  const d = await api('GET',`/api/posts/${postId}/comments`);
  list.innerHTML = d.comments.length ? '' : '<div class="muted">Noch keine Kommentare.</div>';
  // Baum aufbauen: parent_comment_id -> Kinder, in Reihenfolge (DFS) mit Einrückung.
  const byParent = {};
  d.comments.forEach(c => { (byParent[c.parent_comment_id || 'root'] ||= []).push(c); });
  const build = (key, depth) => (byParent[key] || []).forEach(c => {
    list.appendChild(commentRow(postId, c, card, depth));
    build(c.id, depth + 1);
  });
  build('root', 0);
  const cb = card.querySelector('[data-comments]');
  if (cb) cb.textContent = `💬 ${d.comments.length} Kommentare`;
}

function commentRow(postId, c, card, depth = 0) {
  const au = c.author || {};
  const mine = me && (c.author_user_id === me.user_id || au.handle === me.handle);
  const indent = Math.min(depth, 5) * 18;
  const row = el(`<div class="comment" style="${indent?`margin-left:${indent}px;border-left:2px solid var(--line);`:''}">
    <div class="row" style="align-items:baseline">
      <b class="clickable" data-openprofile="${esc(au.handle||'')}">${esc(au.display_name||'Unbekannt')}</b>
      <span class="handle clickable" data-openprofile="${esc(au.handle||'')}">@${esc(au.handle||'?')}</span>
      <span class="muted" style="font-size:12px;margin-left:6px" title="${esc(c.created_at)}">${relTime(c.created_at)}</span>
      ${c.edited_at?'<span class="vis" style="margin-left:6px">✏️ bearbeitet</span>':''}
      <span class="sp" style="flex:1"></span>
      ${mine?'<button class="ghost small" data-ced>✏️</button><button class="ghost small" data-cdel>🗑</button>':''}
    </div>
    <div data-cbody style="margin-top:2px">${linkifyMentions(c.body)}</div>
    <div class="reacts" style="margin-top:4px">
      ${REACTS.map(([k,lab])=>`<button class="small" data-creact="${k}">${lab.split(' ')[0]} ${(c.reaction_counts&&c.reaction_counts[k])||0}</button>`).join('')}
      <button class="ghost small" data-creply>↩ Antworten</button>
      ${mine?'':'<button class="ghost small" data-creport title="Kommentar melden">🚩</button>'}
    </div>
  </div>`);
  row.querySelectorAll('[data-openprofile]').forEach(el => { if (el.dataset.openprofile) el.onclick = () => openProfile(el.dataset.openprofile); });
  row.querySelectorAll('[data-hashtag]').forEach(el => el.onclick = () => openHashtag(el.dataset.hashtag));
  const crep = row.querySelector('[data-creport]');
  if (crep) crep.onclick = async () => {
    const reason = prompt('Warum meldest du diesen Kommentar? (optional)') ?? '';
    if (reason === null) return;
    try { await api('POST',`/api/comments/${c.id}/report`,{ reason }); alert('Danke — der Kommentar wurde gemeldet.'); }
    catch(e){ alert(e.message); }
  };
  row.querySelectorAll('[data-creact]').forEach(btn => btn.onclick = async () => {
    try { await api('POST',`/api/comments/${c.id}/react`,{ type:btn.dataset.creact }); loadComments(postId, card); } catch(e){ alert(e.message); }
  });
  row.querySelector('[data-creply]').onclick = () => {
    if (row.querySelector('[data-replybox]')) return;
    const box = el(`<div data-replybox style="margin-top:6px">
      <input data-ri placeholder="Antwort an @${esc(au.handle||'')}…">
      <div class="row" style="margin-top:4px"><button class="small" data-rs>Antworten</button><button class="ghost small" data-rc>Abbrechen</button></div></div>`);
    row.appendChild(box);
    box.querySelector('[data-ri]').focus();
    box.querySelector('[data-rc]').onclick = () => box.remove();
    box.querySelector('[data-rs]').onclick = async () => {
      const val = box.querySelector('[data-ri]').value;
      if (!val.trim()) return;
      try { await api('POST',`/api/posts/${postId}/comments`,{ body: val, parentCommentId: c.id }); loadComments(postId, card); }
      catch(e){ alert(e.message); }
    };
  };
  const del = row.querySelector('[data-cdel]');
  if (del) del.onclick = async () => {
    if (!confirm('Kommentar löschen?')) return;
    try { await api('POST',`/api/comments/${c.id}/delete`); loadComments(postId, card); } catch(e){ alert(e.message); }
  };
  const ed = row.querySelector('[data-ced]');
  if (ed) ed.onclick = () => {
    const bodyEl = row.querySelector('[data-cbody]');
    if (row.querySelector('[data-cedit]')) return;
    const box = el(`<div data-cedit style="margin-top:4px"><input data-ci value="${esc(bodyEl.textContent)}">
      <div class="row" style="margin-top:4px"><button class="small" data-cs>Speichern</button><button class="ghost small" data-cc>Abbrechen</button></div></div>`);
    bodyEl.style.display='none'; bodyEl.after(box);
    box.querySelector('[data-cc]').onclick = () => { box.remove(); bodyEl.style.display=''; };
    box.querySelector('[data-cs]').onclick = async () => {
      try { await api('POST',`/api/comments/${c.id}/edit`,{ body: box.querySelector('[data-ci]').value }); loadComments(postId, card); }
      catch(e){ alert(e.message); }
    };
  };
  return row;
}

async function refreshNotifCount() {
  try {
    const d = await api('GET','/api/notifications');
    const badge = document.getElementById('notifBadge');
    if (d.unread > 0) { badge.textContent = d.unread; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');
  } catch {}
}
async function showNotifications() {
  const d = await api('GET','/api/notifications');
  const verbs = { follow:'folgt dir jetzt', comment:'hat kommentiert', reaction:'hat reagiert auf deinen Beitrag', mention:'hat dich erwähnt', dm:'hat dir geschrieben', exchange_offer:'bietet jetzt an, was du suchst:', exchange_want:'sucht, was du anbietest:', verified:'Dein Profil wurde verifiziert ✔' };
  const icons = { follow:'👥', comment:'💬', reaction:'👍', mention:'@', dm:'✉️', exchange_offer:'🔄', exchange_want:'🔄', verified:'✔' };
  app.innerHTML = '';
  const head = el(`<div class="card"><div class="row"><h1 style="flex:1">🔔 Benachrichtigungen</h1>
    <button class="ghost small" id="back">Zurück</button></div>
    <div id="notiflist" style="margin-top:8px"></div>
    <div style="margin-top:12px"><button class="small" id="readall">Alle als gelesen markieren</button></div></div>`);
  app.appendChild(head);
  const list = head.querySelector('#notiflist');
  if (!d.notifications.length) list.innerHTML = '<div class="muted">Noch keine Benachrichtigungen.</div>';
  d.notifications.forEach(n => {
    const who = n.actor ? n.actor.display_name : 'Jemand';
    const noWho = n.type === 'verified';
    const row = el(`<div class="comment clickable" style="cursor:pointer;${n.read?'':'background:#eef6f1'}">
      <div class="row" style="align-items:baseline">
        <span>${icons[n.type]||'🔔'}</span>
        <span style="margin-left:6px">${n.read?'':'<b>'}${noWho?'':'<b>'+esc(who)+'</b> '}${esc(verbs[n.type]||n.type)}${n.label?' „'+esc(n.label)+'"':''}${n.read?'':'</b>'}</span>
        <span class="sp" style="flex:1"></span>
        <span class="muted" style="font-size:12px">${relTime(n.created_at)}</span>
      </div></div>`);
    row.onclick = () => {
      if (!n.read) { api('POST',`/api/notifications/${n.id}/read`).then(refreshNotifCount).catch(()=>{}); }
      if (n.type === 'follow' && n.actor) { mainScreen().then(()=>openProfile(n.actor.handle)); }
      else if (n.type === 'dm' && n.ref_id) { openDmThread(n.ref_id); }
      else if (n.type === 'exchange_offer' || n.type === 'exchange_want') {
        mainScreen().then(()=>{ exchangeQuery = (n.label||'').split(/\s+/)[0]; exchangeFilter=''; exchangeBL=''; tab='exchange';
          document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
          const tb=document.querySelector('.tabs button[data-tab="exchange"]'); if(tb) tb.classList.add('active'); loadTab(); });
      }
      else if (n.post_id) { mainScreen().then(()=>openPost(n.post_id)); }
      else if (n.actor) { mainScreen().then(()=>openProfile(n.actor.handle)); }
    };
    list.appendChild(row);
  });
  head.querySelector('#back').onclick = mainScreen;
  head.querySelector('#readall').onclick = async () => { await api('POST','/api/notifications/read-all'); refreshNotifCount(); showNotifications(); };
  refreshNotifCount();
}

// Einzelbeitrag-Ansicht (z.B. aus einer Benachrichtigung heraus), Kommentare offen.
async function openPost(postId) {
  const feed = document.getElementById('feed');
  if (!feed) return;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  feed.innerHTML = '<div class="muted">lädt…</div>';
  try {
    const d = await api('GET','/api/posts/'+encodeURIComponent(postId));
    feed.innerHTML = '';
    const head = el(`<div class="card"><div class="row"><b>Beitrag</b><span class="sp" style="flex:1"></span><button class="ghost small" data-back>← zurück zum Feed</button></div></div>`);
    head.querySelector('[data-back]').onclick = () => { tab='public'; document.querySelector('.tabs button[data-tab="public"]').classList.add('active'); loadTab(); };
    feed.appendChild(head);
    const cardEl = postCard(d.post);
    feed.appendChild(cardEl);
    cardEl.querySelector('[data-comments]').click(); // Kommentare gleich aufklappen
  } catch(e){ feed.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; }
}

async function showModeration() {
  app.innerHTML = '<div class="card muted">lädt…</div>';
  let d, vq;
  try { d = await api('GET','/api/reports'); vq = await api('GET','/api/verify/requests'); }
  catch(e){ app.innerHTML = '<div class="card err">'+esc(e.message)+'</div>'; return; }
  app.innerHTML = '';
  const head = el(`<div class="card"><div class="row"><h1 style="flex:1">🛡️ Moderation</h1>
    <button class="ghost small" id="back">Zurück</button></div>
    <div class="muted">Offene Meldungen: ${d.reports.length} · Verifizierungs-Anträge: ${vq.requests.length}</div></div>`);
  head.querySelector('#back').onclick = mainScreen;
  app.appendChild(head);
  // Verifizierungs-Anträge
  if (vq.requests.length) {
    app.appendChild(el('<div class="muted" style="margin:6px 2px;font-weight:700">✔ Verifizierungs-Anträge</div>'));
    vq.requests.forEach(rq => {
      const card = el(`<div class="card">
        <div><b>${esc(rq.display_name||'?')}</b> <span class="handle">@${esc(rq.handle||'?')}</span></div>
        <div class="post-body" style="margin:6px 0">${rq.note?esc(rq.note):'<span class="muted">Kein Nachweis-Hinweis angegeben.</span>'}</div>
        <div class="row"><button class="small" data-approve>✔ Verifizieren</button><button class="ghost small" data-reject>Ablehnen</button></div>
      </div>`);
      card.querySelector('[data-approve]').onclick = async () => { try { await api('POST',`/api/verify/${encodeURIComponent(rq.user_id)}/resolve`,{ approve:true }); showModeration(); } catch(e){ alert(e.message); } };
      card.querySelector('[data-reject]').onclick = async () => { try { await api('POST',`/api/verify/${encodeURIComponent(rq.user_id)}/resolve`,{ approve:false }); showModeration(); } catch(e){ alert(e.message); } };
      app.appendChild(card);
    });
  }
  if (d.reports.length) app.appendChild(el('<div class="muted" style="margin:10px 2px 6px;font-weight:700">🚩 Gemeldete Beiträge</div>'));
  else if (!vq.requests.length) { app.appendChild(el('<div class="card muted">Keine offenen Meldungen oder Anträge. 👍</div>')); return; }
  d.reports.forEach(r => {
    const post = r.post;
    const card = el(`<div class="card">
      <div class="muted">${post&&post.is_comment?'💬 Kommentar ':''}Gemeldet von @${esc(r.reporter_handle||'?')}${r.reason?' · Grund: '+esc(r.reason):' · kein Grund angegeben'}</div>
      ${post ? `<div class="post-body">${esc(post.body)}</div>
        <div class="vis">Autor: @${esc(post.author_handle||'?')}${post.deleted?' · <b style="color:#c0392b">bereits entfernt</b>':''}</div>`
             : '<div class="muted">Ziel nicht mehr vorhanden.</div>'}
      <div class="row" style="margin-top:10px">
        <button class="small" data-remove style="background:#c0392b">🗑 ${post&&post.is_comment?'Kommentar':'Beitrag'} entfernen</button>
        <button class="ghost small" data-ok>✓ In Ordnung (Meldung schließen)</button>
      </div>
    </div>`);
    card.querySelector('[data-remove]').onclick = async () => {
      try { await api('POST',`/api/reports/${r.id}/resolve`,{ remove:true }); showModeration(); } catch(e){ alert(e.message); }
    };
    card.querySelector('[data-ok]').onclick = async () => {
      try { await api('POST',`/api/reports/${r.id}/resolve`,{ remove:false }); showModeration(); } catch(e){ alert(e.message); }
    };
    app.appendChild(card);
  });
}

async function refreshDmCount() {
  try {
    const d = await api('GET','/api/dm');
    const badge = document.getElementById('dmBadge');
    if (d.unread > 0) { badge.textContent = d.unread; badge.classList.remove('hidden'); }
    else badge.classList.add('hidden');

async function showDmInbox() {
  const d = await api('GET','/api/dm');
  app.innerHTML = '';
  const box = el(`<div class="card"><div class="row"><h1 style="flex:1">✉️ Nachrichten</h1>
    <button class="ghost small" id="back">Zurück</button></div>
    <div class="row" style="margin:6px 0 12px"><input id="dmto" placeholder="@Handle für neue Nachricht…"><button class="small" id="dmnew">Schreiben</button></div>
    <div id="dmthreads"></div></div>`);
  app.appendChild(box);
  document.getElementById('back').onclick = mainScreen;
  document.getElementById('dmnew').onclick = async () => {
    const h = v('dmto').trim().replace(/^@/,''); if (!h) return;
    try { const r = await api('POST','/api/dm/start',{ handle:h }); openDmThread(r.thread.id); }
    catch(e){ alert(e.message); }
  };
  const list = document.getElementById('dmthreads');
  if (!d.threads.length) { list.innerHTML = '<div class="muted">Noch keine Konversationen. Starte oben eine neue.</div>'; }
  else d.threads.forEach(t => {
    const o = t.other || {};
    const row = el(`<div class="comment clickable" style="cursor:pointer">
      <div class="row"><b>${esc(o.display_name||'Unbekannt')}</b> <span class="handle">@${esc(o.handle||'?')}</span>
      <span class="sp" style="flex:1"></span>${t.unread?`<span class="badge">${t.unread}</span>`:''}</div>
      <div class="muted" style="margin-top:2px">${esc((t.last_message?.body||'').slice(0,60))}</div></div>`);
    row.onclick = () => openDmThread(t.thread_id);
    list.appendChild(row);
  });
  refreshDmCount();
}

async function openDmThread(threadId) {
  const d = await api('GET','/api/dm/'+encodeURIComponent(threadId));
  const o = d.other || {};
  app.innerHTML = '';
  const box = el(`<div class="card"><div class="row">
      <button class="ghost small" id="back">← Nachrichten</button>
      <span class="sp" style="flex:1"></span>
      <b class="clickable" data-openprofile="${esc(o.handle||'')}">${esc(o.display_name||'Unbekannt')}</b>
      <span class="handle">@${esc(o.handle||'?')}</span>
    </div>
    <div id="dmmsgs" style="margin:12px 0;max-height:60vh;overflow-y:auto"></div>
    <div class="row"><input id="dmbody" placeholder="Nachricht schreiben…" style="flex:1"><button class="small" id="dmsend">Senden</button></div>
  </div>`);
  app.appendChild(box);
  document.getElementById('back').onclick = showDmInbox;
  const openP = box.querySelector('[data-openprofile]');
  if (openP && openP.dataset.openprofile) openP.onclick = () => { mainScreen().then(()=>openProfile(openP.dataset.openprofile)); };
  const msgs = document.getElementById('dmmsgs');
  const render = (messages) => {
    msgs.innerHTML = '';
    if (!messages.length) msgs.innerHTML = '<div class="muted">Noch keine Nachrichten — sag Hallo 👋</div>';
    messages.forEach(m => {
      const mine = me && m.sender_user_id === me.user_id;
      msgs.appendChild(el(`<div style="display:flex;margin:4px 0;${mine?'justify-content:flex-end':''}">
        <div style="max-width:75%;padding:8px 12px;border-radius:12px;background:${mine?'var(--green)':'#eef3f0'};color:${mine?'#fff':'inherit'}">${esc(m.body)}</div></div>`));
    });
    msgs.scrollTop = msgs.scrollHeight;
  };
  render(d.messages);
  const send = async () => {
    const inp = document.getElementById('dmbody');
    if (!inp.value.trim()) return;
    try {
      await api('POST','/api/dm/'+encodeURIComponent(threadId),{ body: inp.value });
      inp.value='';
      const fresh = await api('GET','/api/dm/'+encodeURIComponent(threadId));
      render(fresh.messages);
    } catch(e){ alert(e.message); }
  };
  document.getElementById('dmsend').onclick = send;
  document.getElementById('dmbody').addEventListener('keydown', e => { if (e.key==='Enter') send(); });
  refreshDmCount();
}
