<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ApoTrend — Apotheker-Netzwerk</title>
<meta name="description" content="Fachnetzwerk für Apotheken: Feed, Lieferengpässe, Preise, Rabatte, News." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0b7f28" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="ApoTrend" />
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a href="#app" class="skiplink" id="skiplink" data-i18n="skiplink">Zum Inhalt springen</a>
<div id="printhead"><h1 style="margin:0" data-i18n="print_head">ApoTrend — Lieferengpässe</h1><div id="printdate" style="color:#444"></div></div>
<header>
  <span class="logo clickable" id="logoHome" role="button" tabindex="0" data-i18n-title="logo_home" data-i18n-aria="logo_home" title="Zur Startseite" aria-label="Zur Startseite"><svg class="logo-ic" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#fff"/><path d="M13 6.2v13.6M6.2 13h13.6" stroke="#0b7f28" stroke-width="3.4" stroke-linecap="round"/></svg><span class="logo-txt">ApoTrend</span></span>
  <span class="muted" id="whoami" style="color:#dff5ea;"></span>
  <span class="sp"></span>
  <select class="hidden" id="countrySwitch" data-i18n-title="country_title" data-i18n-aria="country_title" title="Land wechseln (stellt auch die Sprache um)" aria-label="Land wechseln"></select>
  <button id="btnTheme" data-i18n-title="aria_theme" data-i18n-aria="aria_theme" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten"><span id="themeIcon">🌙</span><span class="hlabel" id="themeLabel">Dunkel</span></button>
  <button id="btnFont" data-i18n-title="font_label" data-i18n-aria="font_label" title="Schriftgröße ändern" aria-label="Schriftgröße ändern"><span id="fontIcon" style="font-weight:800">A⁺</span><span class="hlabel" data-i18n="font_label">Schrift</span></button>
  <button class="bell hidden" id="btnHelp" data-i18n-aria="hdr_help" data-i18n-title="hdr_help" title="Hilfe" aria-label="Hilfe">❓<span class="hlabel" data-i18n="hdr_help">Hilfe</span></button>
  <button class="bell hidden" id="btnMod" data-i18n-aria="hdr_mod" data-i18n-title="hdr_mod" title="Moderation" aria-label="Moderation">🛡️<span class="hlabel" data-i18n="hdr_mod">Moderation</span></button>
  <button class="bell hidden" id="btnDm" data-i18n-aria="hdr_dm" data-i18n-title="hdr_dm" title="Nachrichten" aria-label="Nachrichten">✉️<span class="hlabel" data-i18n="hdr_dm">Nachrichten</span><span class="badge hidden" id="dmBadge">0</span></button>
  <button class="bell hidden" id="btnNotif" data-i18n-aria="hdr_notif" data-i18n-title="hdr_notif" title="Benachrichtigungen" aria-label="Benachrichtigungen">🔔<span class="hlabel" data-i18n="hdr_notif">Meldungen</span><span class="badge hidden" id="notifBadge">0</span></button>
  <button class="hidden" id="btnLogout" data-i18n-aria="hdr_logout" data-i18n-title="hdr_logout" title="Abmelden" aria-label="Abmelden">🚪<span class="hlabel" data-i18n="hdr_logout">Abmelden</span></button>
</header>
<main class="wrap" id="app" tabindex="-1" role="main"></main>

<script src="/app.js"></script>
</body>
</html>
